    <div class="note">無効化しても過去の成約記録・導入済み表示はそのまま残ります（新規の選択肢から消えるだけ）。名称の誤字修正等が必要な場合はスプレッドシートの「商材」シートで直接編集できます。</div>`);
}
async function prodAdd(){
  const name=document.getElementById("pa-name").value.trim();
  if(!name){ toast("商材名を入力してください"); return; }
  const sel=document.querySelector("#pa-colors button.act");
  const color=sel?sel.dataset.c:COLORS[0];
  try{
    await api({action:"prod_add", name, color});
    toast("商材「"+name+"」を追加しました");
    await tick(); openProdAdmin();
  }catch(e){ toast("追加に失敗: "+e.message); }
}
async function prodSet(id, patch){
  try{
    await api(Object.assign({action:"prod_set", id}, patch));
    await tick(); openProdAdmin();
  }catch(e){ toast("変更に失敗: "+e.message); }
}
async function prodCycleColor(id){
  const pr=prodOf(id); if(!pr) return;
  const i=COLORS.indexOf(pr.color);
  const next=COLORS[(i+1+COLORS.length)%COLORS.length]||COLORS[0];
  await prodSet(id,{color:next});
}
function openOrgSettings(){
  const s=srv||{};
  openSheet(`
    <div class="sh-title">組織設定</div>
    <div class="sh-sub">全メンバーに反映されます（変更は監査ログに記録）</div>
    <div class="field"><label>組織・チーム名</label><input id="og-name" value="${esc(s.org_name||"")}"></div>
    <div class="field"><label>勤務時間帯（この時間外は全員の位置送信が自動停止）</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="time" id="og-ws" value="${esc(s.work_start||"09:00")}" style="flex:1;border:1.5px solid var(--line);border-radius:14px;padding:10px;background:var(--field);color:var(--ink)">〜
        <input type="time" id="og-we" value="${esc(s.work_end||"19:00")}" style="flex:1;border:1.5px solid var(--line);border-radius:14px;padding:10px;background:var(--field);color:var(--ink)">
      </div></div>
    <div class="field"><label>位置の表示範囲</label>
      <select id="og-vis">
        <option value="all" ${s.visibility!=="admin"?"selected":""}>全員がお互いに見える（Zenly型）</option>
        <option value="admin" ${s.visibility==="admin"?"selected":""}>メンバーには管理者と自分のみ表示（管理者は全員見える）</option>
      </select></div>
    <div class="field"><label>チャット機能</label>
      <select id="og-chat">
        <option value="on" ${s.chat_enabled!=="off"?"selected":""}>ON（チーム全員のグループチャット）</option>
        <option value="off" ${s.chat_enabled==="off"?"selected":""}>OFF（チャットタブを非表示）</option>
      </select></div>
    <div class="note" style="margin-top:-6px;margin-bottom:10px">※ 他社へ「ホスト型（自社運用SaaS）」で提供する場合のみ、チャットONは電気通信事業の届出が必要になります（B2B販売パック1章）。自社利用・納品型販売では届出不要です。</div>
    <div class="field"><label>候補リストのデータURL（空=標準の飲食店リスト／off=候補機能を無効化）</label><input id="og-cand" placeholder="https://…/data.js" value="${esc(s.cand_url||"")}"></div>
    <div class="field"><label>移動履歴の保存日数（1〜365日・短いほど安全）</label><input id="og-ret" type="number" min="1" max="365" value="${esc(s.retention_days||"30")}"></div>
    <div class="btnrow"><button class="btn ghost" onclick="closeSheet()">キャンセル</button>
    <button class="btn pri" onclick="saveOrgSettings()">保存する</button></div>
    <div class="sec-label">同意の再取得</div>
    <div class="note">同意事項の内容を変えた場合は、同意バージョンを上げると全員に再同意画面が表示されます。現在: v${esc(String(s.consent_version||1))}
    <div class="btnrow"><button class="btn sec" onclick="bumpConsent()">バージョンを上げて全員に再同意を求める</button></div></div>`);
}
async function saveOrgSettings(){
  try{
    await api({action:"settings_set", settings:{
      org_name:document.getElementById("og-name").value.trim(),
      work_start:document.getElementById("og-ws").value,
      work_end:document.getElementById("og-we").value,
      visibility:document.getElementById("og-vis").value,
      chat_enabled:document.getElementById("og-chat").value,
      cand_url:document.getElementById("og-cand").value.trim(),
      retention_days:document.getElementById("og-ret").value
    }});
    closeSheet(); toast("組織設定を保存しました");
    await tick();
  }catch(e){ toast("保存に失敗: "+e.message); }
}
async function bumpConsent(){
  if(!confirm("全メンバーに再同意を求めますか？")) return;
  try{
    const v=Number((srv&&srv.consent_version)||1)+1;
    await api({action:"settings_set", settings:{consent_version:String(v)}});
    closeSheet(); toast("同意バージョンをv"+v+"に上げました"); tick();
  }catch(e){ toast("失敗: "+e.message); }
}
async function openAudit(){
  openSheet(`<div class="sh-title">監査ログ</div><div class="sh-sub">読込中…</div>`);
  try{
    const j=await api({action:"audit_list"});
    const items=(j.items||[]).map(it=>`
      <div class="audititem"><span class="when">${new Date(Number(it.ts)).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span>
      <span><b>${esc(it.name||"—")}</b> ${esc(auditLabel(it.action))} <span style="color:var(--sub)">${esc(it.detail||"")}</span></span></div>`).join("");
    openSheet(`<div class="sh-title">監査ログ</div><div class="sh-sub">直近100件（180日で自動削除）</div>${items||'<div class="empty">記録なし</div>'}`);
  }catch(e){ openSheet(`<div class="sh-title">監査ログ</div><div class="note">読込に失敗: ${esc(e.message)}</div>`); }
}
function auditLabel(a){
  return {join:"参加", login_fail:"認証失敗", member_add:"メンバー追加", member_disable:"無効化", member_enable:"有効化",
    member_role:"役割変更", member_reissue:"コード再発行", member_purge:"移動データ削除", member_set:"メンバー変更",
    pin_del:"スポット削除", pin_bulk:"一括取込", photo_add:"写真追加", photo_del:"写真削除", settings_set:"設定変更",
    consent:"同意", export:"データ出力", chat_del:"チャット削除", prod_add:"商材追加", prod_set:"商材変更"}[a]||a;
}

/* =====================================================================
   初回セットアップ＆同意
===================================================================== */
function openSetup(msg){
  document.getElementById("setup").classList.add("open");
  const pj = pendingJoin;
  document.getElementById("setupBody").innerHTML=`
    <div class="setup-hero">
      <div class="logo">マ</div>
      <h1>マワル MAP</h1>
      <p>チームの「いま」と訪問先が、ひとつの地図に</p><div class="rule"></div>
    </div>
    ${msg?`<div class="note" style="margin-bottom:12px">⚠ ${esc(msg)}</div>`:""}
    ${pj?`<div class="note" style="margin-bottom:12px;background:#E8F8F2;color:#00795B">✅ 招待を受け取りました。名前の確認だけで参加できます。</div>`:""}
    <div class="card">
      <div class="field"><label>サーバーURL（管理者から共有されたURL）</label><input id="su-api" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(pj?pj.api:cfg.api)}"></div>
      <div class="field"><label>参加コード（8桁）</label><input id="su-code" placeholder="例: AB2C-D3EF" autocapitalize="characters" style="font-family:monospace;letter-spacing:.1em" value="${esc(pj?pj.code:"")}"></div>
      <div class="field"><label>表示名（初期管理者として参加する場合のみ必須）</label><input id="su-name" placeholder="例: 宮崎" value="${esc(cfg.name)}"></div>
      <div class="field"><label>自分の色</label><div class="colorpick" id="su-colors">${COLORS.map(c=>`<button style="background:${c}" class="${cfg.color===c?'act':''}" onclick="cfg.color='${c}';document.querySelectorAll('#su-colors button').forEach(b=>b.classList.remove('act'));this.classList.add('act')"></button>`).join("")}</div></div>
      <div class="btnrow"><button class="btn pri" onclick="setupJoin()">参加する</button></div>
      <div class="btnrow"><button class="btn sec" onclick="setupDemo()">まずはデモモードで見てみる</button></div>
    </div>
    <div class="card">
      <div class="feat">リアルタイム位置共有（勤務時間内のみ・本人がON/OFF）</div>
      <div class="feat">訪問先の地図・写真・メモ・訪問記録をチームで共有</div>
      <div class="feat">訪問予定の割り当てと自動チェック</div>
      <div class="feat">近い順ルート作成・成約率の自動集計</div>
      <div class="feat">使い捨て参加コード・監査ログ・自動削除のセキュア設計</div>
    </div>`;
}
async function setupJoin(){
  const apiUrl=document.getElementById("su-api").value.trim();
  const code=document.getElementById("su-code").value.trim();
  const name=document.getElementById("su-name").value.trim();
  if(!apiUrl||!code){ toast("サーバーURLと参加コードを入力してください"); return; }
  toast("接続中…");
  try{
    const res=await fetch(apiUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"join", invite:code, name, color:cfg.color, ua:navigator.userAgent.slice(0,110)})});
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||"参加できませんでした");
    cfg.api=apiUrl; cfg.token=j.token; cfg.demo=false; saveCfg();
    pendingJoin=null;
    document.getElementById("demoBanner").style.display="none";
    applyServerPayload(j);
    document.getElementById("setup").classList.remove("open");
    startWatch(); startLoop();
    toast("参加しました！ようこそ "+(j.me?j.me.name:"")+" さん");
    if(j.me && j.me.needConsent) openConsent();
  }catch(e){ toast("参加失敗: "+e.message); }
}
function setupDemo(){
  const name=document.getElementById("su-name").value.trim();
  cfg.name=name||"あなた"; cfg.demo=true; cfg.role="admin"; saveCfg();
  document.getElementById("setup").classList.remove("open");
  demoInit(); document.getElementById("demoBanner").style.display="block";
  map.setView(DEMO.center,14);
  srv=DEMO.settings;
  document.getElementById("orgName").textContent=DEMO.settings.org_name;
  document.getElementById("bulkBtn").style.display="";
  updateChatVisibility();
  startWatch(); startLoop();
  if(!cfg._demoConsent) openConsent();
}
function openConsent(viewOnly){
  openSheet(`
    <div class="sh-title">位置情報の取り扱い</div>
    <div class="consent" style="box-shadow:none;padding:4px 0">
      ${consentText().split("\n").map(l=>l.startsWith("【")?`<h3 style="font-size:15px;margin:4px 0 8px;font-weight:900">${esc(l)}</h3>`:`<p style="margin-bottom:7px;font-size:13.5px">${esc(l)}</p>`).join("")}
    </div>
    ${viewOnly?
      `<div class="btnrow"><button class="btn pri" onclick="closeSheet()">閉じる</button></div>`:
      `<div class="btnrow"><button class="btn ghost" onclick="consentNo()">同意しない</button><button class="btn pri" onclick="consentYes()">同意してはじめる</button></div>
       <div class="note">「同意しない」でも、地図・スポット・チャット機能は位置共有なしで利用できます。同意はいつでも設定から確認・撤回（共有停止）できます。</div>`}`);
}
async function consentYes(){
  closeSheet();
  try{ await api({action:"consent", version:(srv&&srv.consent_version)||1, ua:navigator.userAgent.slice(0,110)}); }catch(e){}
  if(meInfo) meInfo.needConsent=false;
  startWatch(); startLoop();
  toast("設定完了！右上のボタンで共有を開始できます");
}
function consentNo(){
  cfg.share=false; saveCfg(); closeSheet();
  if(meInfo) meInfo.needConsent=false;
  startLoop(); updateShareBadge();
  toast("位置共有なしで利用します（設定からいつでも変更可）");
}

/* ---------- トースト ---------- */
let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2800);
}

/* ---------- 起動 ---------- */
applyTheme();
initMap();
if(cfg.demo){
  demoInit(); document.getElementById("demoBanner").style.display="block";
  map.setView(DEMO.center,14); srv=DEMO.settings;
  document.getElementById("orgName").textContent=DEMO.settings.org_name;
  document.getElementById("bulkBtn").style.display = cfg.role==="admin"?"":"none";
  updateChatVisibility();
  if(cfg.share) startWatch();
  startLoop();
}else if(cfg.api && cfg.token){
  if(pendingJoin) openSetup("新しい招待を受け取りました。参加すると現在の接続は上書きされます。");
  if(cfg.share) startWatch();
  startLoop();
}else if(new URLSearchParams(location.search).get("demo")){
  // 共有URL用: ?demo=1 で開くと即デモが始まる
  cfg.name=cfg.name||"ゲスト"; cfg.demo=true; cfg.role="admin"; saveCfg();
  demoInit(); document.getElementById("demoBanner").style.display="block";
  map.setView(DEMO.center,14); srv=DEMO.settings;
  document.getElementById("orgName").textContent=DEMO.settings.org_name;
  document.getElementById("bulkBtn").style.display="";
  updateChatVisibility();
  startLoop();
  if(!cfg._demoConsent) openConsent();
}else{
  openSetup();
}
updateShareBadge();
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
