<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1A1B1E">
<title>マワル MAP｜チーム位置共有・営業スポット地図</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cyberjapandata.gsi.go.jp" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js" crossorigin=""></script>
<style>
:root{
  --brand:#2E5BFF; --brand2:#2E5BFF; --mint:#0E9F6E; --red:#E5484D; --amber:#E8890C;
  --ink:#1A1B1E; --sub:#75767C; --line:#E6E4DE; --bg:#F3F2ED; --card:#FFFFFF; --field:#F8F7F3;
  --chipbg:#EFEEE8;
  --pri-bg:#1A1B1E; --pri-fg:#FFFFFF;
  --glass:rgba(255,255,255,.9); --glassbd:rgba(26,27,30,.08);
  --r:14px;
  --shadow:0 1px 2px rgba(26,27,30,.06),0 16px 32px -18px rgba(26,27,30,.28);
  --shadow-sm:0 1px 2px rgba(26,27,30,.05),0 8px 18px -14px rgba(26,27,30,.2);
  --grad:var(--pri-bg);
  --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  --ink:#EDEDEF; --sub:#8E9096; --line:#292B31; --bg:#101114; --card:#1A1C20; --field:#141519;
  --chipbg:#24262C;
  --pri-bg:#F1F0EC; --pri-fg:#141519;
  --glass:rgba(22,24,28,.9); --glassbd:rgba(240,240,236,.09);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 32px -14px rgba(0,0,0,.7);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35),0 8px 18px -12px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"IBM Plex Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.65;font-weight:400;-webkit-font-smoothing:antialiased}
.i{vertical-align:-3px;flex:0 0 auto}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit;font-weight:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);font-weight:500}
b,strong{font-weight:700}
.fab,.btn,.iconbtn,.chip,.toggle,#chatSend,.seg button{transition:transform .12s ease, box-shadow .2s, background .2s, color .2s}
.fab:active,.btn:active,.iconbtn:active,.chip:active,#chatSend:active,.seg button:active{transform:scale(.94)}
#map{position:fixed;inset:0;z-index:1;background:#E4E9F2}
html[data-theme="dark"] #map{background:#0C111E}
#map.tile-pale .leaflet-tile{filter:saturate(.82) contrast(1.02)}
html[data-theme="dark"] #map.tile-dark .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.86) saturate(.6)}
.leaflet-control-attribution{font-size:10px;background:var(--glass)!important;color:var(--sub)!important;backdrop-filter:blur(8px)}
.leaflet-control-attribution a{color:var(--sub)!important}

/* ===== ガラス面 ===== */
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border:1px solid var(--glassbd)}

/* ===== ヘッダー ===== */
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 4px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#topbar>*{pointer-events:auto}
.brandrow{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:9px;border-radius:999px;padding:7px 15px 7px 8px;box-shadow:var(--shadow)}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--pri-bg);display:flex;align-items:center;justify-content:center;color:var(--pri-fg);font-weight:700;font-size:14px}
.brand b{font-size:14.5px;letter-spacing:.08em;font-weight:700}
.brand small{color:var(--sub);font-size:10px;display:flex;align-items:center;gap:4px;margin-top:-3px;max-width:170px;white-space:nowrap;overflow:hidden;font-weight:700}
.conndot{width:7px;height:7px;border-radius:50%;background:var(--mint);flex:0 0 auto}
.conndot.bad{background:var(--red)}
.sharebadge{margin-left:auto;display:flex;align-items:center;gap:7px;border-radius:999px;padding:9px 15px;box-shadow:var(--shadow);font-size:13px;font-weight:900}
.sharebadge .dot{width:9px;height:9px;border-radius:50%;background:#B9C1D6}
.sharebadge.on .dot{background:var(--mint);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(0,200,150,.3)}50%{box-shadow:0 0 0 7px rgba(0,200,150,.05)}}
#areaChips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
#areaChips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--sub);box-shadow:var(--shadow-sm)}
.chip.act{color:var(--pri-fg);background:var(--pri-bg);border-color:transparent}
.chip.act small{opacity:.7;color:inherit}

/* ===== マップ上ボタン ===== */
.mapbtns{position:fixed;right:12px;bottom:calc(158px + var(--safe-b));z-index:20;display:flex;flex-direction:column;gap:10px}
.fab{width:48px;height:48px;border-radius:15px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.fab.primary{background:var(--pri-bg);color:var(--pri-fg);width:56px;height:56px;border-radius:17px;border:none}
#demoBanner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--safe-b));z-index:20;background:var(--amber);color:#4A3200;font-size:12px;font-weight:900;border-radius:999px;padding:6px 16px;box-shadow:var(--shadow);display:none;white-space:nowrap}
#legend{position:fixed;left:12px;bottom:calc(126px + var(--safe-b));z-index:19;border-radius:12px;padding:7px 12px;box-shadow:var(--shadow);font-size:10.5px;font-weight:600;display:flex;gap:9px;align-items:center;flex-wrap:wrap;max-width:70%}
#legend b{font-size:10px;color:var(--sub);letter-spacing:.06em}
#legend span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
#legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ===== マーカー ===== */
.mk{position:relative;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 5px 10px rgba(16,24,40,.35))}
.mk-av{width:44px;height:44px;border-radius:50%;background:var(--c,#3D5AFE);border:3px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:17px;position:relative}
.mk.me .mk-av{outline:3px solid rgba(61,90,254,.4);animation:ring 2.4s infinite}
@keyframes ring{0%,100%{outline-color:rgba(61,90,254,.4)}50%{outline-color:rgba(61,90,254,.08)}}
.mk-hd{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0}
.mk-hd::after{content:"";position:absolute;left:-6px;top:-34px;border:6px solid transparent;border-bottom:10px solid var(--c,#3D5AFE)}
.mk-name{margin-top:3px;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--glassbd);border-radius:999px;padding:1px 9px;font-size:10.5px;font-weight:900;white-space:nowrap;color:var(--ink)}
.mk-bat{position:absolute;top:-5px;right:-9px;background:var(--card);border-radius:999px;font-size:9px;font-weight:900;padding:1px 5px;color:var(--mint);box-shadow:var(--shadow-sm)}
.mk-bat.low{color:var(--red)}
.mk.stale{opacity:.55}
.pinmk{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 4px 8px rgba(16,24,40,.32));animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.4) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pinmk-ic{width:37px;height:37px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c,#FF6B6B);border:2.5px solid #fff;display:flex;align-items:center;justify-content:center}
.pinmk-ic span{transform:rotate(45deg);font-size:16px}
.pinmk-name{margin-top:4px;background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--glassbd);border-radius:999px;padding:0 8px;font-size:10px;font-weight:800;white-space:nowrap;max-width:112px;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.pinmk.done .pinmk-ic{background:#9AA4BC}
.pinmk.rsel .pinmk-ic{outline:3px solid var(--amber)}
.pinmk .badge{position:absolute;top:-6px;right:-4px;background:var(--mint);color:#fff;border-radius:50%;width:17px;height:17px;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
/* 候補(飲食店リスト)= 小さな丸ドット。管理スポットのティアドロップと視覚的に区別 */
.cand{width:15px;height:15px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px rgba(26,27,30,.35);opacity:.92}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(26,27,30,.22)}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:rgba(26,27,30,.82);color:#fff;font-weight:700;font-family:inherit}

/* ===== 下部ナビ ===== */
#nav{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:30;border-radius:18px;box-shadow:var(--shadow);display:flex;padding:6px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:13px;font-size:9.5px;font-weight:600;color:var(--sub);position:relative;letter-spacing:.02em}
#nav button .ic{display:flex;height:19px;align-items:center}
#nav button.act{color:var(--pri-fg);background:var(--pri-bg)}
.navbadge{position:absolute;top:2px;right:14%;background:var(--red);color:#fff;border-radius:99px;font-size:9px;min-width:16px;padding:0 4px;font-weight:700;display:none;border:2px solid var(--card)}

/* ===== パネル ===== */
.panel{position:fixed;inset:0;z-index:25;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.panel.open{display:flex}
.panel-h{padding:18px 18px 10px;display:flex;align-items:center;gap:10px}
.panel-h h2{font-size:20px;letter-spacing:.03em;font-weight:900}
.panel-h .cnt{background:var(--chipbg);color:var(--sub);border-radius:999px;font-size:12px;font-weight:700;padding:2px 10px}
.panel-body{flex:1;overflow-y:auto;padding:0 14px calc(100px + var(--safe-b));-webkit-overflow-scrolling:touch}
.searchbox{margin:0 14px 10px;background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;padding:0 12px;box-shadow:var(--shadow-sm)}
.searchbox input{flex:1;border:none;outline:none;background:none;padding:11px 8px;color:var(--ink)}
.tabseg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 14px 12px;box-shadow:var(--shadow-sm)}
.tabseg button{flex:1;border-radius:9px;padding:8px;font-size:13px;font-weight:600;color:var(--sub)}
.tabseg button.act{background:var(--pri-bg);color:var(--pri-fg)}

/* ===== カード ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:14px;margin-bottom:10px}
.mcard{display:flex;align-items:center;gap:12px}
.mcard .av{width:47px;height:47px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px}
.mcard .info{flex:1;min-width:0}
.mcard .nm{font-weight:900;font-size:15px}
.mcard .meta{font-size:12px;color:var(--sub);display:flex;gap:8px;flex-wrap:wrap;font-weight:700}
.mcard .acts{display:flex;gap:6px}
.iconbtn{background:var(--chipbg);color:var(--ink);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.iconbtn.warn{background:#FFECEE;color:var(--red)}
html[data-theme="dark"] .iconbtn.warn{background:#3A2028}
.pincard{display:flex;gap:12px;align-items:flex-start;border-width:2px}
.pincard.rsel{border-color:var(--amber)}
.pincard .thumb{width:66px;height:66px;border-radius:16px;flex:0 0 auto;background:linear-gradient(135deg,var(--chipbg),var(--field));display:flex;align-items:center;justify-content:center;font-size:27px;overflow:hidden}
.pincard .thumb img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;border-radius:7px;font-size:10.5px;font-weight:900;padding:1px 8px;margin-right:4px}
.sec-label{font-size:11.5px;font-weight:900;color:var(--sub);margin:18px 4px 8px;letter-spacing:.1em}

/* ===== 予定 ===== */
.schrow{display:flex;align-items:center;gap:11px}
.schk{width:26px;height:26px;border-radius:50%;border:2.5px solid #C6CEE2;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900}
.schk.on{background:var(--mint);border-color:var(--mint)}
.schrow .t{flex:1;min-width:0}
.schrow .t b{font-size:14.5px;font-weight:800}
.schrow.done .t b{text-decoration:line-through;color:var(--sub)}
.schrow .t small{display:block;font-size:11.5px;color:var(--sub);font-weight:700}
.schrow .who{font-size:11px;font-weight:900;background:var(--chipbg);color:var(--brand);border-radius:8px;padding:2px 8px;white-space:nowrap}
.schrow .del{color:var(--sub);font-size:15px;padding:4px}
.overdue{color:var(--red)!important}

/* ===== チャット ===== */
#chatList{display:flex;flex-direction:column;padding-bottom:calc(168px + var(--safe-b)) !important}
.day-sep{text-align:center;font-size:11px;color:var(--sub);margin:14px 0 6px;font-weight:900}
.msgrow{display:flex;gap:8px;margin:5px 0;align-items:flex-end}
.msgrow.mine{flex-direction:row-reverse}
.msg-av{width:31px;height:31px;border-radius:50%;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 auto}
.msg-body{max-width:74%;display:flex;flex-direction:column}
.mine .msg-body{align-items:flex-end}
.msg-name{font-size:10.5px;color:var(--sub);margin:0 6px 1px;font-weight:800}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 5px;padding:8px 13px;font-size:14px;box-shadow:var(--shadow-sm);word-break:break-word;white-space:pre-wrap}
.mine .bubble{background:var(--pri-bg);color:var(--pri-fg);border:none;border-radius:14px 14px 5px 14px}
.bubble.big{font-size:34px;padding:4px 8px;background:none;border:none;box-shadow:none}
.msg-meta{font-size:10px;color:var(--sub);margin:2px 6px 0;display:flex;gap:8px;font-weight:700}
.msg-meta button{color:var(--sub);font-size:10px}
.msg-attach{margin-top:5px;background:var(--field);border:1.5px solid var(--line);border-radius:13px;padding:8px 12px;font-size:12.5px;font-weight:800;color:var(--brand);display:flex;align-items:center;gap:6px}
.mine .msg-attach{background:rgba(128,128,128,.22);border-color:rgba(128,128,128,.4);color:inherit}
#chatBar{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--safe-b));z-index:28;border-radius:22px;box-shadow:var(--shadow);padding:9px 10px;display:none}
#chatBar.open{display:block}
.chat-quick{display:flex;gap:6px;margin-bottom:7px;align-items:center;overflow-x:auto;scrollbar-width:none}
.chat-quick button{font-size:17px;background:var(--field);border-radius:11px;padding:3px 10px;border:1px solid var(--line);flex:0 0 auto}
.chat-quick .loc{font-size:11px;font-weight:900;color:var(--brand)}
.chat-inrow{display:flex;gap:8px;align-items:center}
#chatInput{flex:1;border:1.5px solid var(--line);border-radius:15px;padding:10px 13px;background:var(--field);outline:none;font-size:15px}
#chatInput:focus{border-color:var(--brand)}
#chatSend{width:44px;height:44px;border-radius:12px;background:var(--pri-bg);color:var(--pri-fg);font-size:16px;flex:0 0 auto}

/* ===== ルートバー ===== */
#routeBar{position:fixed;left:12px;right:12px;bottom:calc(80px + var(--safe-b));z-index:28;border-radius:22px;box-shadow:var(--shadow);padding:11px 15px;display:none;align-items:center;gap:10px}
#routeBar.open{display:flex}
#routeBar b{color:var(--amber)}

/* ===== 集計 ===== */
.statnum{display:flex;gap:8px;margin-bottom:14px;align-items:stretch}
.statnum>div{flex:1;background:var(--field);border:1.5px solid var(--line);border-radius:16px;padding:11px 8px;text-align:center}
.statnum b{font-size:23px;display:block;font-weight:900}
.statnum small{font-size:11px;color:var(--sub);font-weight:800}
.donutwrap{display:flex;align-items:center;gap:16px;background:var(--field);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.donut{width:86px;height:86px;border-radius:50%;position:relative;flex:0 0 auto}
.donut::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--field)}
.donut span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;z-index:1}
.barrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12.5px;font-weight:700}
.barrow .lbl{width:86px;flex:0 0 auto;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .track{flex:1;background:var(--field);border-radius:99px;height:15px;overflow:hidden}
.barrow .fill{height:100%;border-radius:99px;transition:width .5s ease}
.barrow .val{width:30px;text-align:right;font-weight:900}

/* ===== ボトムシート ===== */
#sheetWrap{position:fixed;inset:0;z-index:40;display:none}
#sheetWrap.open{display:block}
#sheetBg{position:absolute;inset:0;background:rgba(10,15,28,.45);backdrop-filter:blur(2px)}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;max-height:88%;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.9,.3,1.1);box-shadow:0 -10px 40px rgba(10,15,28,.25)}
@keyframes up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.griparea{padding:11px 0 4px;flex:0 0 auto;touch-action:none;cursor:grab}
#sheet .grip{width:46px;height:5px;border-radius:99px;background:#CBD3E6;margin:0 auto}
html[data-theme="dark"] #sheet .grip{background:#39445E}
#sheetBody{overflow-y:auto;padding:8px 20px calc(26px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sh-title{font-size:19px;font-weight:900;margin-bottom:2px}
.sh-sub{font-size:12.5px;color:var(--sub);margin-bottom:12px;font-weight:700}
.btnrow{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.btn{flex:1;min-width:90px;border-radius:12px;padding:12px;text-align:center;font-weight:700;font-size:14px}
.btn.pri{background:var(--pri-bg);color:var(--pri-fg)}
.btn.sec{background:var(--chipbg);color:var(--ink)}
.btn.warn{background:#FFECEE;color:var(--red)}
html[data-theme="dark"] .btn.warn{background:#3A2028}
.btn.ghost{background:var(--field);color:var(--sub);border:1px solid var(--line)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:900;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--field);outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(61,90,254,.12)}
.field textarea{min-height:74px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--sub);background:var(--card)}
.seg button.act{border-color:transparent;color:var(--pri-fg);background:var(--pri-bg)}
.photos{display:flex;gap:8px;overflow-x:auto;padding:4px 0;margin-bottom:6px}
.photos img{width:112px;height:112px;object-fit:cover;border-radius:16px;flex:0 0 auto;background:var(--chipbg)}
.photos .addph{width:112px;height:112px;border-radius:16px;border:2px dashed #C4CCE0;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 auto;gap:4px}
.photos .addph span{font-size:24px}
.kv{display:flex;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv b{width:88px;flex:0 0 auto;color:var(--sub);font-weight:800}
.colorpick{display:flex;gap:10px;flex-wrap:wrap}
.colorpick button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.colorpick button.act{border-color:var(--ink)}
.codebox{background:#1A1B1E;color:#fff;border-radius:14px;padding:18px;text-align:center;margin:10px 0}
.codebox .code{font-family:Consolas,Menlo,monospace;font-size:27px;letter-spacing:.14em;font-weight:900}
.codebox small{opacity:.7;font-size:11px;display:block;margin-top:4px;font-weight:700}
.codebox img{background:#fff;border-radius:12px;padding:8px;margin-top:12px;max-width:190px}
.vh{font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;font-weight:700}
.vh .when{color:var(--sub);white-space:nowrap}

/* ===== 設定 ===== */
.setrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .ic2{width:34px;height:34px;border-radius:11px;background:var(--chipbg);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.setrow .t{flex:1}
.setrow .t b{font-size:14.5px;font-weight:800}
.setrow .t small{display:block;color:var(--sub);font-size:11.5px;line-height:1.5;font-weight:700}
.setrow select{border:1.5px solid var(--line);border-radius:11px;padding:8px;background:var(--field);color:var(--ink)}
.toggle{width:52px;height:30px;border-radius:99px;background:#CBD3E4;position:relative;flex:0 0 auto}
html[data-theme="dark"] .toggle{background:#39445E}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.toggle.on{background:var(--mint)}
.toggle.on::after{left:25px}
.rolebadge{border-radius:7px;font-size:10px;font-weight:900;padding:1px 7px;background:#FFF3E0;color:#E65100}
html[data-theme="dark"] .rolebadge{background:#3A2F1A}
.statusdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
#setup{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none;padding:max(24px,env(safe-area-inset-top)) 22px calc(40px + var(--safe-b))}
#setup.open{display:block}
.setup-hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 24px 28px;text-align:center;margin-bottom:14px;box-shadow:var(--shadow)}
.setup-hero .logo{width:54px;height:54px;border-radius:16px;background:var(--pri-bg);color:var(--pri-fg);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto 14px}
.setup-hero h1{font-size:24px;letter-spacing:.14em;font-weight:700}
.setup-hero p{font-size:12.5px;color:var(--sub);margin-top:6px;font-weight:500;letter-spacing:.04em}
.setup-hero .rule{width:36px;height:2px;background:var(--pri-bg);margin:14px auto 0;border-radius:2px}
.feat{display:flex;gap:10px;align-items:center;padding:8px 2px 8px 12px;font-size:13px;font-weight:500;border-left:2px solid var(--line);margin:2px 0}

.consent{background:var(--card);border-radius:var(--r);padding:16px;font-size:13.5px}
.note{font-size:11.5px;color:var(--sub);background:var(--chipbg);border-radius:12px;padding:9px 13px;margin-top:8px;font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(100px + var(--safe-b));z-index:70;background:rgba(13,19,34,.92);backdrop-filter:blur(8px);color:#fff;font-size:13px;font-weight:800;border-radius:16px;padding:11px 20px;opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.9,.3,1.1);max-width:88%;text-align:center;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--sub);padding:44px 20px;font-size:13.5px;font-weight:700}
.empty .big{width:56px;height:56px;border-radius:16px;background:var(--chipbg);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px;filter:grayscale(.3)}
.audititem{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600}
.audititem .when{color:var(--sub);white-space:nowrap;flex:0 0 auto}
#lightbox{position:fixed;inset:0;z-index:80;background:rgba(6,10,20,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px}
#lightbox.open{display:flex}
#lightbox img{max-width:94%;max-height:84%;border-radius:14px}
#lightbox .lbdel{background:#FFECEE;color:var(--red);border-radius:14px;padding:10px 22px;font-weight:900;font-size:13px}
@media(min-width:760px){
  #nav{left:50%;right:auto;transform:translateX(-50%);width:580px}
  .panel-body,.searchbox,.tabseg{max-width:680px;margin-left:auto;margin-right:auto;width:100%}
  #sheet{left:50%;transform:translateX(-50%);width:580px;border-radius:28px;bottom:24px}
  #chatBar,#routeBar{left:50%;transform:translateX(-50%);width:580px;right:auto}
  #setup.open{display:flex;flex-direction:column;align-items:center}
  #setup>div{width:530px}
}

<script>
"use strict";
/* =====================================================================
   マワル MAP v4.0 — チーム位置共有＋営業スポット地図＋チャット＋訪問予定
   v4.0: デザイン全面刷新(専用フォント/ガラスUI/新マーカー/シートのドラッグ操作)
         訪問予定(日付・担当割当→訪問記録で自動消込→予定からルート作成)
         QRコード招待(読むだけで接続情報を自動入力) / OS共有でスポット送信
         成約率ドーナツ / 写真削除(管理者) / 全データCSV出力 / 進行方向表示
         1分ガイド内蔵
   バックエンド: Google Apps Script + スプレッドシート（Code.gs v4.0）
===================================================================== */

const VERSION = "6.0";
const COLORS = ["#3D5AFE","#FF5252","#00C896","#FF9100","#7C4DFF","#00B0FF","#F50057","#607D8B"];
const PIN_TYPES = {
  "顧客宅":{emoji:"🏠",color:"#FF6B6B"}, "店舗":{emoji:"🍽️",color:"#FF9F43"},
  "見込み":{emoji:"⭐",color:"#FFC531"}, "取引先":{emoji:"🤝",color:"#00C896"},
  "拠点":{emoji:"🏢",color:"#3D5AFE"}, "その他":{emoji:"📍",color:"#8E9BB5"}
};
const PIN_STATUS = ["未訪問","対応中","成約","再訪予定","NG"];
const VISIT_RESULTS = ["在宅・面談","不在","成約","再訪約束","NG","チラシ投函","その他"];
const PH_PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110"><rect width="110" height="110" rx="16" fill="#E8ECFA"/><text x="55" y="62" font-size="26" text-anchor="middle">🖼️</text></svg>');

function consentText(){
  const org = (srv&&srv.org_name) || "運用組織";
  return `【位置情報の取り扱いについて（同意事項 v${(srv&&srv.consent_version)||1}）】
1. 目的: ${org}の訪問業務の効率化（訪問先の割り振り・合流・進捗共有）と、外回り中の安全確認のためにのみ利用します。
2. 取得する情報: 位置情報の共有をONにしている間の現在地・移動速度・端末バッテリー残量。
3. 共有範囲: 同じ組織に参加している社内メンバーのみ。社外には一切共有されません。
4. 勤務時間外: 共有OFFの間は位置情報を一切送信しません。勤務時間帯（${(srv&&srv.work_start)||"09:00"}〜${(srv&&srv.work_end)||"19:00"}）の外では自動的に送信を停止する設定が利用できます。組織が勤務時間外の位置情報を取得・閲覧することはありません。
5. 保存期間: 移動履歴は${(srv&&srv.retention_days)||30}日、チャットは180日で自動削除されます。
6. 権利: ご自身のデータはいつでも「設定 → 自分のデータを出力」で確認でき、共有はいつでも停止できます。停止しても業務上の不利益はありません。`;
}

/* ---------- 設定 ---------- */
let cfg = Object.assign({
  api:"", token:"", memberId:"", name:"", role:"member", color:COLORS[0],
  demo:false, share:false, interval:30, autoOff:true, tile:1, theme:"light", notify:false, colorMode:"type", catFilter:"",
  candOn:false, candPrio:""
}, JSON.parse(localStorage.getItem("mawaru_cfg")||"{}"));
function saveCfg(){ localStorage.setItem("mawaru_cfg", JSON.stringify(cfg)); }
// テーマ初期値の変更(v6): 「自動」既定をやめ、明示的に選んでいない人はライトに一度だけ移行
if(!cfg._thm2){ if((cfg.theme||"auto")==="auto") cfg.theme="light"; cfg._thm2=1; saveCfg(); }

/* ---------- 状態 ---------- */
let state = {members:[], pins:[], visits:[], schedules:[], products:[]};
let srv = null, meInfo = null;
let map, tileLayer, memberLayer, pinLayer, trailLayer;
let myPos=null, myBattery=null, mySpeed=null, myHeading=null, watchId=null, pollTimer=null, chatTimer=null;
let pauseUntil = Number(localStorage.getItem("mawaru_pause")||0);
let areaFilter="", followId="", curView="map", visTab="sched";
let failStreak=0;
const photoCache = new Map();
const notifiedPins = new Set();
let chatMap = new Map();
let lastChatTs = 0;
let lastReadTs = Number(localStorage.getItem("mawaru_chatread")||0);
let routeMode=false; const routeSel=new Set();
let pendingJoin=null;

/* ---------- QR招待リンクの受け取り (#j=...) ---------- */
(function(){
  const m = location.hash.match(/#j=([A-Za-z0-9+/=\-_%]+)/);
  if(!m) return;
  try{
    const o = JSON.parse(decodeURIComponent(atob(m[1])));
    if(o && o.api) pendingJoin = o;
    history.replaceState(null, "", location.pathname + location.search);
  }catch(e){}
})();

/* ---------- テーマ ---------- */
function applyTheme(){
  const mode = cfg.theme||"auto";
  const dark = mode==="dark" || (mode==="auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);

/* =====================================================================
   API 層
===================================================================== */
async function api(payload){
  if (cfg.demo) return demoApi(payload);
  if (!cfg.api) throw new Error("未接続");
  if (payload.action!=="join") payload.token = cfg.token;
  const ctl = new AbortController();
  const to = setTimeout(()=>ctl.abort(), 20000);
  let res;
  try{
    res = await fetch(cfg.api, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload), signal: ctl.signal});
  }finally{ clearTimeout(to); }
  const j = await res.json();
  if (j.auth===false){ onAuthLost(); throw new Error(j.error||"認証エラー"); }
  if (!j.ok) throw new Error(j.error||"サーバーエラー");
  return j;
}
function onAuthLost(){
  cfg.token=""; saveCfg();
  openSetup("アクセス権が無効になっています。新しい参加コードで再参加してください。");
}
function setConn(ok){
  failStreak = ok? 0 : failStreak+1;
  document.getElementById("connDot").classList.toggle("bad", failStreak>=2);
}
function applyServerPayload(j){
  if(j.state){
    state = j.state;
    state.schedules = state.schedules||[];
    if(Array.isArray(j.state.chat)){
      chatMap = new Map(j.state.chat.map(m=>[String(m.id), m]));
      j.state.chat.forEach(m=>{ lastChatTs = Math.max(lastChatTs, m.ts); });
      onChatUpdated(false);
    }
    renderAll();
  }
  if(j.settings){
    srv = j.settings;
    document.getElementById("orgName").textContent = srv.org_name || "チーム位置共有";
    updateChatVisibility();
  }
  if(j.me){
    meInfo = j.me;
    cfg.memberId=j.me.id; cfg.name=j.me.name; cfg.role=j.me.role; cfg.color=j.me.color||cfg.color; saveCfg();
    document.getElementById("bulkBtn").style.display = cfg.role==="admin" ? "" : "none";
    if(j.me.needConsent && !document.getElementById("sheetWrap").classList.contains("open")) openConsent();
  }
}
function chatEnabled(){ return !srv || srv.chat_enabled!=="off"; }
function updateChatVisibility(){
  document.getElementById("navChat").style.display = chatEnabled()? "" : "none";
  if(!chatEnabled() && curView==="chat") showView("map");
}

/* ---------- オフライン送信キュー ---------- */
function outbox(){ return JSON.parse(localStorage.getItem("mawaru_outbox")||"[]"); }
function outboxPush(p){ const q=outbox(); q.push(p); localStorage.setItem("mawaru_outbox", JSON.stringify(q)); }
async function outboxFlush(){
  let q = outbox();
  if(!q.length) return;
  const rest = [];
  for(const p of q){
    try{ await api(p); }
    catch(e){ rest.push(p); }
  }
  localStorage.setItem("mawaru_outbox", JSON.stringify(rest));
  if(q.length && !rest.length) toast("未送信だったデータを送信しました");
}

async function demoApi(p){
  await new Promise(r=>setTimeout(r,110));
  switch(p.action){
    case "join": case "state": case "loc": return demoPayload();
    case "trail": return {ok:true, points:DEMO.trails[p.memberId]||[]};
    case "chat_send": {
      const m={id:++DEMO.seq,memberId:"me",name:cfg.name||"あなた",text:p.text||"",pinId:p.pinId||null,
        lat:p.lat==null?null:p.lat, lng:p.lng==null?null:p.lng, ts:Date.now()};
      DEMO.chat.push(m);
      setTimeout(()=>{
        const replies=["了解です！","👍","ナイスです🔥","こちらも順調です"];
        DEMO.chat.push({id:++DEMO.seq,memberId:1,name:"小島",text:replies[Math.floor(Math.random()*replies.length)],pinId:null,lat:null,lng:null,ts:Date.now()});
      }, 2500);
      return {ok:true, id:m.id};
    }
    case "chat_list": return {ok:true, messages:DEMO.chat.filter(m=>m.ts>(Number(p.since)||0)).slice(-100)};
    case "chat_del": DEMO.chat=DEMO.chat.filter(m=>m.id!=p.id); return {ok:true};
    case "sched_add": {
      const pin=DEMO.pins.find(x=>x.id==p.pinId);
      DEMO.schedules.push({id:++DEMO.seq,pinId:p.pinId,pinName:pin?pin.name:"?",assignee:p.assignee||"",date:p.date,done:false,by:cfg.name||"あなた"});
      return {ok:true};
    }
    case "sched_done": { const s=DEMO.schedules.find(x=>x.id==p.id); if(s) s.done=!!p.done; return {ok:true}; }
    case "sched_del": DEMO.schedules=DEMO.schedules.filter(x=>x.id!=p.id); return {ok:true};
    case "pin_save":
      if(p.pin.id){ const i=DEMO.pins.findIndex(x=>x.id==p.pin.id); if(i>=0) DEMO.pins[i]=Object.assign(DEMO.pins[i],p.pin); return {ok:true,id:p.pin.id}; }
      p.pin.id=++DEMO.seq; p.pin.photos=[]; p.pin.ts=Date.now(); p.pin.by=cfg.name||"あなた"; DEMO.pins.push(p.pin); return {ok:true,id:p.pin.id};
    case "pin_del":
      DEMO.audit.unshift({ts:Date.now(),name:cfg.name||"あなた",action:"pin_del",detail:String(p.id)});
      DEMO.pins=DEMO.pins.filter(x=>x.id!=p.id); return {ok:true};
    case "pin_bulk": {
      let n=0;
      (p.pins||[]).forEach(q=>{ if(q.name&&q.lat!=null){ DEMO.pins.push({id:++DEMO.seq,name:q.name,type:q.type||"店舗",area:q.area||"",addr:q.addr||"",lat:q.lat,lng:q.lng,memo:q.memo||"",status:"未訪問",photos:[],by:cfg.name||"あなた",ts:Date.now()}); n++; } });
      return {ok:true, added:n};
    }
    case "visit_add": {
      const pin=DEMO.pins.find(x=>x.id==p.pinId);
      const prodIds=(p.products||[]).map(String);
      DEMO.visits.push({id:++DEMO.seq,pinId:p.pinId,pinName:pin?pin.name:"?",by:cfg.name||"あなた",result:p.result,note:p.note,products:prodIds,ts:Date.now()});
      if(pin){
        pin.visits=(pin.visits||0)+1;
        if(p.result==="成約"){
          pin.status="成約";
          pin.prods=pin.prods||[];
          prodIds.forEach(x=>{ if(!pin.prods.includes(x)) pin.prods.push(x); });
        }
      }
      DEMO.schedules.forEach(s=>{ if(s.pinId==p.pinId && s.date===todayStr(0) && !s.done && (s.assignee===(cfg.name||"あなた")||!s.assignee)) s.done=true; });
      return {ok:true};
    }
    case "prod_add": {
      const id="p"+(++DEMO.seq);
      DEMO.products.push({id,name:p.name,color:p.color||"#2E5BFF",active:true});
      DEMO.audit.unshift({ts:Date.now(),name:cfg.name||"あなた",action:"prod_add",detail:p.name});
      return {ok:true, id};
    }
    case "prod_set": {
      const pr=DEMO.products.find(x=>String(x.id)===String(p.id));
      if(pr){ if(p.name)pr.name=p.name; if(p.color)pr.color=p.color; if(p.active==="1")pr.active=true; if(p.active==="0")pr.active=false; }
      return {ok:true};
    }
    case "photo_add": {
      const pin=DEMO.pins.find(x=>x.id==p.pinId);
      const id="demo"+(++DEMO.seq);
      photoCache.set(id, "data:image/jpeg;base64,"+p.data);
      if(pin){ pin.photos=pin.photos||[]; pin.photos.push(id); }
      return {ok:true, photoId:id};
    }
    case "photo_del": {
      const pin=DEMO.pins.find(x=>x.id==p.pinId);
      if(pin) pin.photos=(pin.photos||[]).filter(x=>x!==p.fileId);
      return {ok:true};
    }
    case "photo_get": return {ok:false, error:"デモでは不要"};
    case "consent": cfg._demoConsent=true; saveCfg(); return {ok:true};
    case "member_list": return {ok:true, members:DEMO.roster.map(m=>({...m}))};
    case "member_add": {
      const code="DEMO-"+String(++DEMO.seq).slice(-4);
      DEMO.roster.push({id:++DEMO.seq,name:p.name,color:"#3D5AFE",role:p.role||"member",status:"active",invite:code,joined:"",lastSeen:"",consentVer:0});
      DEMO.audit.unshift({ts:Date.now(),name:cfg.name||"あなた",action:"member_add",detail:p.name});
      return {ok:true, invite:code};
    }
    case "member_set": {
      const m=DEMO.roster.find(x=>x.id==p.id);
      if(m&&p.status) m.status=p.status;
      if(m&&p.role) m.role=p.role;
      return {ok:true};
    }
    case "member_reissue": {
      const m=DEMO.roster.find(x=>x.id==p.id);
      const code="DEMO-"+String(++DEMO.seq).slice(-4);
      if(m) m.invite=code;
      return {ok:true, invite:code};
    }
    case "member_purge": return {ok:true, purged:42};
    case "member_export": case "my_export":
      return {ok:true, data:{profile:{name:cfg.name||"あなた"},locationLogs:DEMO.trails[1]||[],visits:DEMO.visits,consents:[{version:1,ts:Date.now()}],exportedAt:new Date().toISOString()}};
    case "settings_set": Object.assign(DEMO.settings, p.settings||{}); DEMO.audit.unshift({ts:Date.now(),name:cfg.name||"あなた",action:"settings_set",detail:JSON.stringify(p.settings)}); return {ok:true};
    case "audit_list": return {ok:true, items:DEMO.audit.slice(0,100)};
  }
  return {ok:true};
}

function photoImgTag(fileId, pinId){
  const cached = photoCache.get(fileId);
  return `<img src="${cached||PH_PLACEHOLDER}" data-pid="${cached?"":fileId}" onclick="event.stopPropagation();if(this.src.startsWith('data:image/jpeg'))openLightbox(this.src,${pinId||"null"},'${esc(String(fileId))}')">`;
}
async function hydratePhotos(root){
  const imgs = (root||document).querySelectorAll("img[data-pid]");
  for(const img of imgs){
    const id = img.getAttribute("data-pid");
    if(!id) continue;
    img.removeAttribute("data-pid");
    if(photoCache.has(id)){ img.src=photoCache.get(id); continue; }
    try{
      const j = await api({action:"photo_get", fileId:id});
      const url = "data:"+(j.mime||"image/jpeg")+";base64,"+j.data;
      photoCache.set(id, url);
      img.src = url;
    }catch(e){}
  }
}
let lbCtx=null;
function openLightbox(src, pinId, fileId){
  document.getElementById("lightboxImg").src = src;
  lbCtx = (pinId && fileId)? {pinId, fileId} : null;
  document.getElementById("lbDel").style.display = (lbCtx && cfg.role==="admin")? "" : "none";
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){ document.getElementById("lightbox").classList.remove("open"); }
async function lbDelete(){
  if(!lbCtx) return;
  if(!confirm("この写真を削除しますか？（削除は監査ログに記録されます）")) return;
  try{
    await api({action:"photo_del", pinId:lbCtx.pinId, fileId:lbCtx.fileId});
    closeLightbox(); toast("写真を削除しました");
    await tick(); openPinSheet(lbCtx.pinId);
  }catch(e){ toast("削除に失敗: "+e.message); }
}

function initMap(){
  map = L.map("map",{zoomControl:false, attributionControl:true}).setView([34.7025,135.4959],14);
  setTile(cfg.tile==null?1:cfg.tile);
  memberLayer=L.layerGroup().addTo(map);
  pinLayer=L.layerGroup().addTo(map);
  trailLayer=L.layerGroup().addTo(map);
  map.on("contextmenu", e=>openPinForm(null, e.latlng.lat, e.latlng.lng));
  map.on("dragstart", ()=>{ followId=""; });
  // 大量ピン時: 地図移動のたびに画面内のピンだけを描き直す
  let mvT=null;
  map.on("moveend zoomend", ()=>{
    if(state.pins.length<=CULL_THRESHOLD) return;
    clearTimeout(mvT); mvT=setTimeout(renderPins, 150);
  });
}
function setTile(i){
  cfg.tile=i%TILES.length; saveCfg();
  if(tileLayer) map.removeLayer(tileLayer);
  const t=TILES[cfg.tile];
  tileLayer=L.tileLayer(t.url,{maxZoom:18,attribution:t.attr}).addTo(map);
  document.getElementById("map").className = t.cls;
}

/* ---------- 汎用 ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function timeAgo(ts){
  if(!ts) return "未共有";
  const s=(Date.now()-ts)/1000;
  if(s<70) return "たった今";
  if(s<3600) return Math.floor(s/60)+"分前";
  if(s<86400) return Math.floor(s/3600)+"時間前";
  return Math.floor(s/86400)+"日前";
}
function fmtTime(ts){ return new Date(ts).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}); }
function dist(a,b){
  const R=6371e3,rad=x=>x*Math.PI/180;
  const dl=rad(b.lat-a.lat), dn=rad(b.lng-a.lng);
  const h=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function fmtDist(m){ return m<950? Math.round(m)+"m" : (m/1000).toFixed(1)+"km"; }
function spdIcon(spd){ if(spd==null||spd<=2) return ""; if(spd<7) return "🚶"; if(spd<22) return "🚴"; return "🚗"; }
function stayMin(m){
  if(!m.stay || (m.spd||0)>3) return 0;
  const min = Math.floor((Date.now()-m.stay)/60000);
  return min>=5 ? min : 0;
}

const CAT_TOC=["顧客宅"], CAT_TOB=["店舗","取引先","拠点"];
function matchCat(p){
  if(!cfg.catFilter) return true;
  if(cfg.catFilter==="toc") return !CAT_TOB.includes(p.type);   // 個人宅: 顧客宅＋見込み等
  if(cfg.catFilter==="tob") return !CAT_TOC.includes(p.type);   // 法人: 店舗・取引先・拠点＋見込み等
  return true;
}
function prodOf(id){ return (state.products||[]).find(x=>String(x.id)===String(id)); }
function prodChipsHtml(ids, small){

const memMk = new Map();
function slideTo(entry, lat, lng){
  if(entry.raf) cancelAnimationFrame(entry.raf);
  const from = entry.mk.getLatLng();
  if(Math.abs(from.lat-lat)<1e-7 && Math.abs(from.lng-lng)<1e-7) return;
  const t0 = performance.now(), dur = 700;
  const step = t=>{
    const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3);
    entry.mk.setLatLng([from.lat+(lat-from.lat)*e, from.lng+(lng-from.lng)*e]);
    if(p<1) entry.raf=requestAnimationFrame(step);
  };
  entry.raf=requestAnimationFrame(step);
}
function renderMembers(){
  const seen = new Set();
  state.members.forEach(m=>{
    let lat=m.lat, lng=m.lng;
    const isMe = String(m.id)===String(cfg.memberId||"me");
    if(isMe && sharingActive() && myPos){ lat=myPos.lat; lng=myPos.lng; }
    if(lat==null||lng==null) return;
    const stale = m.ts && Date.now()-m.ts > 15*60e3;
    const stay = stayMin(m);
    const bat = (m.bat!=null&&m.bat!=="")? `<div class="mk-bat ${m.bat<=20?'low':''}">${m.bat}%</div>`:"";
    const hd = (isMe && myHeading!=null && (mySpeed||0)>2)? `<div class="mk-hd" style="transform:rotate(${Math.round(myHeading)}deg)"></div>`:"";
    const html =
      `<div class="mk ${isMe?'me':''} ${stale?'stale':''}" style="--c:${esc(m.color||'#3D5AFE')}">
         <div class="mk-av">${esc((m.name||"?").slice(0,1))}${bat}${hd}</div>
         <div class="mk-name">${esc(m.name)}${stale?" ⏸":(stay>=10?" ⏱":"")}</div>
       </div>`;
    const key = String(m.id);
    let e = memMk.get(key);
    if(!e){
      const mk = L.marker([lat,lng],{icon:L.divIcon({className:"",iconSize:[48,66],iconAnchor:[24,33],html})}).addTo(memberLayer);
      e = {mk, html, raf:null, data:m};
      mk.on("click",()=>openMemberSheet(e.data));
      memMk.set(key,e);
    }else{

      slideTo(e, lat, lng);

    seen.add(key);

/* =====================================================================
   候補レイヤー（飲食店営業リストの統合）
   ・管理スポットとは別の「丸ドット」レイヤー（優先度色・クラスタ集約）
   ・タップ→「スポットに登録」で管理対象へ昇格。登録済みは候補から自動非表示
   ・データURLは組織設定 cand_url で差替可能（B2B納品時は顧客ごとのリストに）
===================================================================== */
const CAND_URL_DEFAULT = "https://sysmiyazaki0806-tech.github.io/m-rlphhcv7/data.js";
const CAND_PRIO_COLOR = {A:"#E5484D", B:"#E8890C", C:"#8A8F99", "":"#8A8F99"};
let candLayer=null, candAll=null, candLoading=false, candSig="";
function candUrl(){
  const u = srv && srv.cand_url;
  if(u==="off") return "";
  return (u && /^https:\/\//.test(u)) ? u : CAND_URL_DEFAULT;
}
function candPrioOf(memo){ const m=/優先度([ABC])/.exec(memo||""); return m?m[1]:""; }
function telOf(text){ const m=/TEL[ 　]*([0-9\-]{10,13})/.exec(text||""); return m?m[1]:""; }
function toggleCand(on){
  cfg.candOn = (on!==undefined)? !!on : !cfg.candOn;
  saveCfg();
  if(cfg.candOn && !candAll) ensureCandidates();
  else renderCands(true);
  renderAreaChips();
  if(document.getElementById("sheetWrap").classList.contains("open") && document.getElementById("sheetBody").innerHTML.includes("地図の表示設定")) openMapSettings();
}
async function ensureCandidates(){
  if(candAll || candLoading) return;
  const url = candUrl();
  if(!url){ toast("この組織では候補リストが無効化されています"); cfg.candOn=false; saveCfg(); renderAreaChips(); return; }
  candLoading=true;
  toast("飲食店リストを読み込み中…（初回のみ・以降はオフラインでも表示）");
  try{
    await new Promise((res,rej)=>{
      const sc=document.createElement("script");
      sc.src=url; sc.onload=res; sc.onerror=rej;
      document.head.appendChild(sc);
    });
    const data = window.SHOPS||[];
    candLayer = L.markerClusterGroup({maxClusterRadius:54, disableClusteringAtZoom:17,
      spiderfyOnMaxZoom:false, showCoverageOnHover:false, chunkedLoading:true});
    candAll = data.map((s,i)=>{
      const prio=candPrioOf(s[6]);
      const mk=L.marker([s[4],s[5]],{icon:L.divIcon({className:"",iconSize:[15,15],iconAnchor:[8,8],
        html:`<div class="cand" style="background:${CAND_PRIO_COLOR[prio]}"></div>`})});
      mk.on("click",()=>openCandSheet(i));
      return {mk, prio, key:s[2]+"|"+(s[3]||"")};
    });
    toast(data.length.toLocaleString()+"店の候補を表示します（○ドット）");
    renderCands(true);
  }catch(e){
    toast("候補リストの読み込みに失敗しました（電波を確認してください）");
    cfg.candOn=false; saveCfg(); renderAreaChips();
  }finally{ candLoading=false; }
}
function renderCands(force){
  if(!candLayer){ if(cfg.candOn && !candLoading) ensureCandidates(); return; }
  const show = cfg.candOn && cfg.catFilter!=="toc";
  const sig = [show, cfg.candPrio, state.pins.length].join("|");
  if(!force && sig===candSig) return;
  candSig=sig;
  if(!show){ if(map.hasLayer(candLayer)) map.removeLayer(candLayer); renderLegend(); return; }
  const pinKeys = new Set(state.pins.map(p=>p.name+"|"+(p.addr||"")));
  const subset = candAll.filter(c=>{
    if(pinKeys.has(c.key)) return false;
    if(cfg.candPrio==="A" && c.prio!=="A") return false;
    if(cfg.candPrio==="AB" && c.prio!=="A" && c.prio!=="B") return false;
    return true;
  }).map(c=>c.mk);
  candLayer.clearLayers();
  candLayer.addLayers(subset);
  if(!map.hasLayer(candLayer)) map.addLayer(candLayer);
  renderLegend();
}

/* =====================================================================
   通信ループ
===================================================================== */
function sharingActive(){
  if(!cfg.share) return false;
  if(pauseUntil>Date.now()) return false;
  if(cfg.autoOff){
    const ws=(srv&&srv.work_start)||"09:00", we=(srv&&srv.work_end)||"19:00";
    const now=new Date(), cur=now.getHours()*60+now.getMinutes();
    const [sh,sm]=ws.split(":").map(Number), [eh,em]=we.split(":").map(Number);
    if(cur < sh*60+sm || cur > eh*60+em) return false;
  }
  return true;
}
function startWatch(){
  if(watchId!=null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(p=>{
    const prev=myPos;
    myPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};
    if(p.coords.heading!=null && !isNaN(p.coords.heading)) myHeading=p.coords.heading;
    if(p.coords.speed!=null && !isNaN(p.coords.speed)) mySpeed=Math.round(p.coords.speed*3.6);
    else if(prev){ const dt=(Date.now()-(prev._t||Date.now()))/1000; if(dt>3) mySpeed=Math.round(dist(prev,myPos)/dt*3.6); }
    myPos._t=Date.now();
  }, ()=>{}, {enableHighAccuracy:true, maximumAge:10000});
  if(navigator.getBattery) navigator.getBattery().then(b=>{
    myBattery=Math.round(b.level*100);
    b.addEventListener("levelchange",()=>{ myBattery=Math.round(b.level*100); });
  });
}
async function tick(){
  if(!connected()) return;
  try{
    await outboxFlush();
    let j;
    if(sharingActive() && myPos){
      j=await api({action:"loc", lat:myPos.lat, lng:myPos.lng, acc:myPos.acc, spd:mySpeed||0, bat:myBattery});
    }else{
      j=await api({action:"state"});
    }
    applyServerPayload(j);
    setConn(true);
    checkNearby();
  }catch(e){ setConn(false); }
  updateShareBadge();
}
function connected(){ return cfg.demo || (cfg.api && cfg.token); }
function startLoop(){
  if(pollTimer) clearInterval(pollTimer);
  tick();
  pollTimer=setInterval(tick, Math.max(15,cfg.interval)*1000);
}
function toggleShare(){
  if(!connected()){ openSetup(); return; }
  if(meInfo && meInfo.needConsent){ openConsent(); return; }
  cfg.share=!cfg.share; saveCfg();
  if(cfg.share){ pauseUntil=0; localStorage.setItem("mawaru_pause","0"); startWatch(); toast("位置共有をONにしました"); }
  else toast("位置共有をOFFにしました");
  updateShareBadge(); tick();
  if(document.getElementById("p-settings").classList.contains("open")) renderSettings();
}

/* =====================================================================
   チャット
===================================================================== */
function onChatUpdated(fromFastPoll){
  const msgs=[...chatMap.values()].sort((a,b)=>a.ts-b.ts);
  document.getElementById("chatCnt").textContent=msgs.length;
  const unread = msgs.filter(m=>m.ts>lastReadTs && String(m.memberId)!==String(cfg.memberId||"me")).length;
  const badge=document.getElementById("chatBadge");
  if(curView==="chat"){ markChatRead(); badge.style.display="none"; }
  else{ badge.textContent=unread>99?"99+":unread; badge.style.display=unread?"":"none"; }
  if(curView==="chat") renderChat();
  if(fromFastPoll===undefined) return;
  const newest = msgs[msgs.length-1];
  if(newest && newest.ts>lastReadTs && String(newest.memberId)!==String(cfg.memberId||"me") && curView!=="chat"){
    notify("💬 "+newest.name, newest.text||"（位置・スポットの共有）");
  }
}
function markChatRead(){
  lastReadTs = Date.now();
  localStorage.setItem("mawaru_chatread", String(lastReadTs));
}
function startChatPoll(){
  stopChatPoll();
  chatTimer=setInterval(async ()=>{
    if(curView!=="chat" || !connected() || !chatEnabled()) return;
    try{
      const j=await api({action:"chat_list", since:lastChatTs});
      let added=false;
      (j.messages||[]).forEach(m=>{
        if(!chatMap.has(String(m.id))){ chatMap.set(String(m.id),m); added=true; }
        lastChatTs=Math.max(lastChatTs,m.ts);
      });
      if(added) onChatUpdated(true);
    }catch(e){}
  }, 5000);
}
function stopChatPoll(){ if(chatTimer){ clearInterval(chatTimer); chatTimer=null; } }
function renderChat(){
  const el=document.getElementById("chatList");
  const msgs=[...chatMap.values()].sort((a,b)=>a.ts-b.ts);
  if(!msgs.length){
    el.innerHTML=`<div class="empty"><div class="big">💬</div>まだメッセージがありません<br>下の入力欄からチームに送れます</div>`;
    return;
  }
  const today=new Date(); today.setHours(0,0,0,0);
  const dayLabel=ts=>{ const d=new Date(ts); d.setHours(0,0,0,0);
    const diff=(today-d)/86400e3;
    return diff===0?"今日":diff===1?"昨日":(d.getMonth()+1)+"/"+d.getDate(); };
  let cur="", html="";
  const isNearBottom = el.scrollHeight-el.scrollTop-el.clientHeight < 160;
  msgs.forEach(m=>{
    const l=dayLabel(m.ts);
    if(l!==cur){ cur=l; html+=`<div class="day-sep">${l}</div>`; }
    const mine = String(m.memberId)===String(cfg.memberId||"me");
    const color = memberColor(m.memberId, m.name);
    const onlyEmoji = m.text && m.text.length<=2 && /\p{Extended_Pictographic}/u.test(m.text);
    let attach="";
    if(m.pinId){
      const p=state.pins.find(x=>String(x.id)===String(m.pinId));
      attach = p? `<div class="msg-attach" onclick="openPinSheet(${p.id})">📌 ${esc(p.name)}${p.area?`<small>(${esc(p.area)})</small>`:""}</div>`
                : `<div class="msg-attach">📌 スポット（削除済み）</div>`;
    }else if(m.lat!=null && m.lng!=null){
      attach = `<div class="msg-attach" onclick="showView('map');map.setView([${m.lat},${m.lng}],16)">📍 現在地（地図で見る）</div>`;
    }
    const canDel = mine || cfg.role==="admin";
    html+=`<div class="msgrow ${mine?'mine':''}">
      ${mine?"":`<div class="msg-av" style="background:${esc(color)}">${esc((m.name||"?").slice(0,1))}</div>`}
      <div class="msg-body">
        ${mine?"":`<div class="msg-name">${esc(m.name)}</div>`}
        ${m.text?`<div class="bubble ${onlyEmoji?'big':''}">${esc(m.text)}</div>`:""}
        ${attach}
        <div class="msg-meta">${fmtTime(m.ts)}${canDel?`<button onclick="delMsg('${esc(String(m.id))}')">削除</button>`:""}</div>
      </div></div>`;
  });
  el.innerHTML=html;
  if(isNearBottom || el.dataset.first!=="1"){ el.scrollTop=el.scrollHeight; el.dataset.first="1"; }
}
async function sendChat(payload){
  payload.action="chat_send";
  try{
    await api(payload);
    try{
      const j=await api({action:"chat_list", since:lastChatTs});
      (j.messages||[]).forEach(m=>{ chatMap.set(String(m.id),m); lastChatTs=Math.max(lastChatTs,m.ts); });
      markChatRead(); onChatUpdated(true);
    }catch(e){}
  }catch(e){
    if(/無効化|認証|未接続/.test(e.message)){ toast("送信できません: "+e.message); return; }
    outboxPush(payload);
    toast("圏外のため送信待ちに保存しました");
  }
}
function sendChatText(){
  const inp=document.getElementById("chatInput");
  const text=inp.value.trim();
  if(!text) return;
  inp.value="";
  sendChat({text});
}
function sendQuick(emoji){ sendChat({text:emoji}); }
function sendMyLocation(){
  if(!myPos){ toast("現在地が未取得です（位置情報の許可を確認）"); return; }
  sendChat({text:"📍 現在地を共有", lat:myPos.lat, lng:myPos.lng});
}
function sharePinToChat(pinId){
  const p=state.pins.find(x=>x.id==pinId); if(!p) return;
  closeSheet();
  sendChat({text:"📌 "+p.name, pinId:p.id});
  showView("chat");
  toast("チャットに共有しました");
}
async function delMsg(id){
  if(!confirm("このメッセージを削除しますか？（削除は監査ログに記録されます）")) return;
  try{
    await api({action:"chat_del", id});
    chatMap.delete(String(id));
    onChatUpdated(true);
  }catch(e){ toast("削除に失敗: "+e.message); }
}
document.getElementById("chatInput").addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.isComposing){ e.preventDefault(); sendChatText(); }
});

function showView(v){
  curView=v;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("act",b.dataset.v===v));
  ["chat","members","pins","visits","settings"].forEach(x=>document.getElementById("p-"+x).classList.toggle("open",v===x));
  document.getElementById("chatBar").classList.toggle("open", v==="chat" && chatEnabled());
  document.getElementById("routeBar").classList.toggle("open", routeMode && (v==="pins"||v==="map"));
  if(v==="chat"){ markChatRead(); onChatUpdated(); renderChat(); startChatPoll(); const el=document.getElementById("chatList"); el.scrollTop=el.scrollHeight; }
  else stopChatPoll();
  if(v==="members") renderMemList();
  if(v==="pins") renderPinList();
  if(v==="visits") renderVisits();
  if(v==="settings") renderSettings();
}

function focusMember(id){
  const m=state.members.find(x=>String(x.id)===String(id)); if(!m||m.lat==null) return;
  showView("map"); followId=id; map.setView([m.lat,m.lng],16);
}
async function showTrail(id, name){
  showView("map");
  try{
    const j=await api({action:"trail", memberId:id});
    trailLayer.clearLayers();
    if(!j.points||j.points.length<2){ toast("今日の足あとはまだありません"); return; }
    const pts=j.points;
    const latlngs=pts.map(p=>[p.lat,p.lng]);
    const m=state.members.find(x=>String(x.id)===String(id));
    L.polyline(latlngs,{color:(m&&m.color)||"#3D5AFE",weight:4,opacity:.75,dashArray:"1 8",lineCap:"round"}).addTo(trailLayer);
    L.circleMarker(latlngs[0],{radius:5,color:"#fff",fillColor:"#8E9BB5",fillOpacity:1,weight:2}).addTo(trailLayer);
    map.fitBounds(latlngs,{padding:[60,60]});
    let total=0;
    for(let i=1;i<pts.length;i++) total+=dist(pts[i-1],pts[i]);
    toast(`${name||""}さんの足あと: ${fmtDist(total)} ／ ${fmtTime(pts[0].ts)}〜${fmtTime(pts[pts.length-1].ts)}（地図タップで消去）`);
    map.once("click",()=>trailLayer.clearLayers());
  }catch(e){ toast("足あとを取得できません: "+e.message); }
}

function toggleRouteMode(){
  routeMode=!routeMode;
  routeSel.clear();

  if(routeMode){ toast("訪問先をタップして選択してください（地図でもリストでも可）"); if(curView!=="pins"&&curView!=="map") showView("pins"); }
  document.getElementById("routeBar").classList.toggle("open", routeMode);
}
function toggleRouteSel(id){
  if(routeSel.has(id)) routeSel.delete(id);
  else{
    if(routeSel.size>=10){ toast("選択できるのは10件までです"); return; }
    routeSel.add(id);
  }
  updateRouteBar(); renderPins(); renderPinList();
}

function startRoute(){
  if(!routeSel.size){ toast("訪問先を選択してください"); return; }
  openRouteFor([...routeSel]);
}
function openRouteFor(ids){
  const pts=state.pins.filter(p=>ids.includes(p.id));
  if(!pts.length){ toast("対象がありません"); return; }
  const origin = myPos || map.getCenter();
  const o = {lat:origin.lat, lng:origin.lng};
  const order=[]; const rest=[...pts]; let cur=o;
  while(rest.length){
    let bi=0, bd=Infinity;
    rest.forEach((p,i)=>{ const d=dist(cur,p); if(d<bd){bd=d;bi=i;} });
    const nxt=rest.splice(bi,1)[0];
    order.push(nxt); cur=nxt;
  }
  const dest=order[order.length-1];
  const wps=order.slice(0,-1).map(p=>p.lat+","+p.lng).join("|");
  const url=`https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lng}&destination=${dest.lat},${dest.lng}&travelmode=driving${wps?`&waypoints=${encodeURIComponent(wps)}`:""}`;
  window.open(url,"_blank","noopener");
  toast(`${order.length}件を近い順に並べてナビを開きました`);
}

/* ---------- 一括取込 ---------- */
let bulkCancel=false;
function openBulkImport(){
  openSheet(`
    <div class="sh-title">スポット一括取込</div>
    <div class="sh-sub">Excelからコピー＆貼り付け（タブ区切り）またはカンマ区切り。1回最大300件</div>
    <div class="note" style="margin-bottom:10px">列の順序: <b>名前, 種別, エリア, 住所, 緯度, 経度, メモ</b><br>・種別は ${Object.keys(PIN_TYPES).join("/")}（空欄→店舗）<br>・緯度経度が空欄の行は<b>住所から自動で座標を取得</b>します（1件あたり約1.2秒）</div>
    <div class="field"><textarea id="bulk-text" style="min-height:140px;font-size:12px" placeholder="居酒屋とり吉	店舗	梅田	大阪市北区堂山町3-x	34.703	135.502	グルぽ候補"></textarea></div>
    <div id="bulkProg" style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--brand)"></div>
    <div class="btnrow">
      <button class="btn ghost" onclick="bulkCancel=true;closeSheet()">キャンセル</button>
      <button class="btn pri" id="bulkGo" onclick="runBulkImport()">解析して取込</button>
    </div>`);
}
async function runBulkImport(){
  const text=document.getElementById("bulk-text").value.trim();
  const prog=document.getElementById("bulkProg");
  if(!text){ toast("データを貼り付けてください"); return; }
  bulkCancel=false;
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const rows=[];
  for(const line of lines){
    const c = line.includes("\t")? line.split("\t") : line.split(",");
    if(!c[0] || c[0].trim()==="名前") continue;
    rows.push({name:c[0].trim(), type:(c[1]||"").trim()||"店舗", area:(c[2]||"").trim(),
      addr:(c[3]||"").trim(), lat:parseFloat(c[4])||null, lng:parseFloat(c[5])||null, memo:(c[6]||"").trim()});
  }
  if(!rows.length){ toast("有効な行がありません"); return; }
  if(rows.length>300){ toast("1回の取込は300件までです（"+rows.length+"件検出）"); return; }
  const needGeo=rows.filter(r=>(r.lat==null||r.lng==null)&&r.addr);
  document.getElementById("bulkGo").disabled=true;
  prog.textContent=`解析OK: ${rows.length}件（うち住所から座標取得: ${needGeo.length}件）`;
  for(let i=0;i<needGeo.length;i++){
    if(bulkCancel) return;
    prog.textContent=`座標を取得中… ${i+1}/${needGeo.length}件（${needGeo[i].name}）`;
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ja&q=${encodeURIComponent(needGeo[i].addr)}`);
      const j=await r.json();
      if(j[0]){ needGeo[i].lat=parseFloat(j[0].lat); needGeo[i].lng=parseFloat(j[0].lon); }
    }catch(e){}
    await new Promise(r=>setTimeout(r,1200));
  }
  const valid=rows.filter(r=>r.lat!=null&&r.lng!=null);
  const skipped=rows.length-valid.length;
  if(!valid.length){ prog.textContent="座標を特定できる行がありませんでした"; document.getElementById("bulkGo").disabled=false; return; }
  prog.textContent=`サーバーへ送信中… ${valid.length}件`;
  try{
    let added=0;
    for(let i=0;i<valid.length;i+=100){
      const j=await api({action:"pin_bulk", pins:valid.slice(i,i+100)});
      added+=j.added||0;
    }
    closeSheet();
    toast(`${added}件を取り込みました${skipped?`（${skipped}件は座標不明でスキップ）`:""}`);
    tick();
  }catch(e){ prog.textContent="取込に失敗: "+e.message; document.getElementById("bulkGo").disabled=false; }
}

function updateSchedBadge(){
  const today=todayStr(0);
  const n=(state.schedules||[]).filter(s=>s.date===today && !s.done &&
    (!s.assignee || s.assignee===cfg.name)).length;
  const b=document.getElementById("schedBadge");
  b.textContent=n; b.style.display=n?"":"none";
}
function schedDayLabel(dateStr){
  const today=todayStr(0), tomorrow=todayStr(1);
  if(dateStr===today) return "今日";
  if(dateStr===tomorrow) return "明日";
  const d=new Date(dateStr+"T00:00:00");
  const w=["日","月","火","水","木","金","土"][d.getDay()];
  return (d.getMonth()+1)+"/"+d.getDate()+"("+w+")";
}

  const label=ts=>{ const d=new Date(ts); d.setHours(0,0,0,0);

    return diff===0?"今日":diff===1?"昨日":(d.getMonth()+1)+"/"+d.getDate(); };

  vs.forEach(v=>{

        ${v.note?`<div style="font-size:13px;margin-top:3px">${esc(v.note)}</div>`:""}</div></div>`;

function renderSchedList(el){
  const list=(state.schedules||[]).slice();
  if(!list.length){
    el.innerHTML=`<div class="empty"><div class="big">📅</div>予定はまだありません<br>スポット詳細の「予定に入れる」から登録できます<br><small style="font-weight:700">担当を割り当てると、その人の「今日やること」になります</small></div>`;
    return;
  }
  const today=todayStr(0);
  const todayMineUndone = list.filter(s=>s.date===today && !s.done).map(s=>s.pinId);
  let html="";
  if(todayMineUndone.length){
    html+=`<div class="btnrow" style="margin:2px 0 10px"><button class="btn pri" onclick='openRouteFor(${JSON.stringify(todayMineUndone)})'>今日の残り${todayMineUndone.length}件でルート作成</button></div>`;
  }
  const dates=[...new Set(list.map(s=>s.date))].sort();
  dates.forEach(d=>{

    html+=`<div class="sec-label ${overdue?'overdue':''}">${schedDayLabel(d)}${overdue?"（期限切れ）":""}</div>`;
    items.forEach(s=>{
      const pin=state.pins.find(p=>String(p.id)===String(s.pinId));
      html+=`<div class="card schrow ${s.done?'done':''}">
        <button class="schk ${s.done?'on':''}" onclick="toggleSched('${esc(String(s.id))}',${s.done?"false":"true"})">${s.done?"✓":""}</button>
        <div class="t" onclick="${pin?`openPinSheet(${pin.id})`:""}">

        <button class="del" onclick="delSched('${esc(String(s.id))}')">✕</button>
      </div>`;
    });
  });
  el.innerHTML=html;
}

let statsDays=1;
function openStats(){ statsDays=1; renderStats(); }
function renderStats(){
  const now=Date.now();
  const dayStart=new Date(); dayStart.setHours(0,0,0,0);
  const from = statsDays===1? dayStart.getTime() : now-statsDays*86400e3;
  const vs=(state.visits||[]).filter(v=>v.ts>=from);
  const total=vs.length;
  const won=vs.filter(v=>v.result==="成約").length;
  const rate= total? Math.round(won/total*100):0;
  const byResult={}, byMember={}, byProd={}, prodColor={};
  vs.forEach(v=>{
    byResult[v.result]=(byResult[v.result]||0)+1;
    byMember[v.by]=(byMember[v.by]||0)+1;
    if(v.result==="成約") (v.products||[]).forEach(id=>{
      const pr=prodOf(id); const nm=pr?pr.name:"不明";
      byProd[nm]=(byProd[nm]||0)+1; prodColor[nm]=pr?pr.color:"#9AA4BC";
    });
  });
  const rc={"成約":"#00C896","NG":"#FF5252","不在":"#8E9BB5","在宅・面談":"#3D5AFE","再訪約束":"#FF9100","チラシ投函":"#7C4DFF","その他":"#607D8B"};
  const maxR=Math.max(1,...Object.values(byResult));
  const maxM=Math.max(1,...Object.values(byMember));
  const bars=(obj,max,colorFn)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    `<div class="barrow"><div class="lbl">${esc(k)}</div><div class="track"><div class="fill" style="width:${Math.round(v/max*100)}%;background:${colorFn(k)}"></div></div><div class="val">${v}</div></div>`).join("");
  openSheet(`
    <div class="sh-title">訪問集計</div>
    <div class="sh-sub">直近${(state.visits||[]).length>=300?"300件（それ以前はスプレッドシート参照）":"の全記録"}から集計</div>
    <div class="seg" style="margin-bottom:12px">
      ${[["今日",1],["7日間",7],["30日間",30]].map(([l,d])=>`<button class="${statsDays===d?'act':''}" onclick="statsDays=${d};renderStats()">${l}</button>`).join("")}
    </div>
    <div class="donutwrap">
      <div class="donut" style="background:conic-gradient(var(--mint) ${rate*3.6}deg, var(--line) 0)"><span>${rate}%</span></div>
      <div style="flex:1">
        <div style="font-weight:900;font-size:15px">成約率</div>
        <div style="font-size:12.5px;color:var(--sub);font-weight:700">${total}件の訪問のうち ${won}件が成約</div>
      </div>
    </div>
    <div class="statnum">
      <div><b>${total}</b><small>訪問</small></div>
      <div><b style="color:var(--mint)">${won}</b><small>成約</small></div>
      <div><b>${(state.schedules||[]).filter(s=>s.date===todayStr(0)&&!s.done).length}</b><small>今日の残予定</small></div>
    </div>
    <div class="sec-label">結果の内訳</div>
    ${bars(byResult,maxR,k=>rc[k]||"#3D5AFE")||'<div class="empty" style="padding:16px">データなし</div>'}
    ${Object.keys(byProd).length?`<div class="sec-label">商材別 成約数</div>${bars(byProd,Math.max(1,...Object.values(byProd)),k=>prodColor[k]||"#9AA4BC")}`:""}
    <div class="sec-label">メンバー別 訪問数</div>
    ${bars(byMember,maxM,k=>memberColor(null,k))||'<div class="empty" style="padding:16px">データなし</div>'}
    <div class="btnrow"><button class="btn sec" onclick="exportVisitsCsv()">CSV出力</button><button class="btn pri" onclick="closeSheet()">閉じる</button></div>`);
}
function exportVisitsCsv(){
  const vs=(state.visits||[]).slice().sort((a,b)=>b.ts-a.ts);
  if(!vs.length){ toast("出力する訪問ログがありません"); return; }
  const rows=[["日時","スポット","担当","結果","メモ"]];
  vs.forEach(v=>rows.push([new Date(v.ts).toLocaleString("ja-JP"), v.pinName, v.by, v.result, v.note||""]));
  csvDownload(rows, "訪問ログ");
}
function exportPinsCsv(){
  if(!state.pins.length){ toast("出力するスポットがありません"); return; }
  const rows=[["名前","種別","エリア","住所","緯度","経度","メモ","ステータス","登録者"]];
  state.pins.forEach(p=>rows.push([p.name,p.type,p.area||"",p.addr||"",p.lat,p.lng,p.memo||"",p.status||"",p.by||""]));
  csvDownload(rows, "スポット一覧");
}
function csvDownload(rows, name){
  const csv="﻿"+rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  downloadBlob(new Blob([csv],{type:"text/csv"}), name+"_"+new Date().toISOString().slice(0,10)+".csv");
  toast("CSVを出力しました");
}
function downloadBlob(blob, filename){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}

const sheetEl=document.getElementById("sheet");
function openSheet(html){ sheetEl.style.transform=""; document.getElementById("sheetBody").innerHTML=html; document.getElementById("sheetWrap").classList.add("open"); hydratePhotos(document.getElementById("sheetBody")); }
function closeSheet(){ document.getElementById("sheetWrap").classList.remove("open"); sheetEl.style.transform=""; }
(function(){
  const grip=document.getElementById("gripArea");
  let startY=null;
  grip.addEventListener("pointerdown", e=>{
    startY=e.clientY;
    sheetEl.style.transition="none";
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener("pointermove", e=>{
    if(startY==null) return;
    const dy=Math.max(0, e.clientY-startY);
    sheetEl.style.transform=`translateY(${dy}px)`;
  });
  const end=e=>{
    if(startY==null) return;
    const dy=Math.max(0, e.clientY-startY);
    startY=null;
    sheetEl.style.transition="transform .22s ease";
    if(dy>110){ sheetEl.style.transform="translateY(105%)"; setTimeout(()=>{ closeSheet(); sheetEl.style.transition=""; },200); }
    else{ sheetEl.style.transform=""; setTimeout(()=>{ sheetEl.style.transition=""; },240); }
  };
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
})();

function compressImage(file,maxW,q){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,maxW/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      res(cv.toDataURL("image/jpeg",q).split(",")[1]);
    };
    img.src=URL.createObjectURL(file);
  });
}

function inviteQRDataUrl(code){
  try{
    if(typeof qrcode!=="function") return "";
    const base = location.origin.startsWith("http") ? location.origin+location.pathname : "";
    if(!base || !cfg.api) return "";
    const payload = btoa(encodeURIComponent(JSON.stringify({api:cfg.api, code:code})));
    const qr = qrcode(0, "M");
    qr.addData(base+"#j="+payload);
    qr.make();
    return qr.createDataURL(5, 8);
  }catch(e){ return ""; }
}
